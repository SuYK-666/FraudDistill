experiment:
  id: exp1_ccfa_cpu_v5
  task: q_y_relation_fraud_risk_detection_cpu_light
  language: zh_report_en_cn_data
  scope: experiment_1_only
labels:
  classes: [safe, unsafe, abstain]
  missing_policy: error
  public_gold_overrides_guard: true
data_targets:
  p0:
    p3_rows: 4614
    p3_components: 3289
    aegis_official_test_rows: 1964
    polyguard_base_ids: 1325
  g0:
    train_rows: 10000
    model_dev_rows: 1000
    threshold_dev_rows: 1000
    p1_mini_components: 1200
    p2_mini_groups: 300
  full:
    train_rows: 33000
    model_dev_rows: 4000
    threshold_dev_rows: 4000
    p1_rows_min: 8000
    p1_components_min: 6000
    p2_groups_min: 1200
    p3_rows: 4614
    p3_components: 3289
split:
  unit: semantic_component_id
  leakage_policy: no_component_overlap
model:
  formal_backend: pairlite_cpu
  xlmr_status: optional_smoke_or_upper_bound_only
pairlite_cpu:
  levels: [B0, B1, R1, R2]
  input_modes: [q_only, y_only, q_y]
  alpha_grid: [0.0001, 0.0003, 0.001]
  l1_ratio_grid: [0.0]
  max_iter_grid: [40]
  default_alpha: 0.0003
  default_l1_ratio: 0.0
  default_max_iter: 40
  char_weight_grid: [0.5, 1.0]
  cross_weight_grid: [0.25, 0.5, 1.0]
  word_tfidf:
    analyzer: word
    ngram_range: [1, 2]
    max_features: 100000
  char_tfidf:
    analyzer: char_wb
    ngram_range: [3, 5]
    max_features: 100000
  cross_hasher:
    n_features: 262144
    top_k_tokens_per_side: 12
statistics:
  seeds: [20260724, 20260725, 20260726, 20260727, 20260728]
  g0_seeds: [20260724, 20260725, 20260726]
  bootstrap_unit: semantic_component_id
  g0c_bootstrap_iterations: 5000
  cluster_bootstrap_iterations: 10000
  mcnemar: exact
  multiple_testing_correction: Holm
data_policy:
  taxonomy_path: configs/data/FRAUD_TAXONOMY_LOCK.yaml
  g0c_id: G0c Data-Corrected Confirmation
  p1_allowed_sources:
    - BeaverTails:30k_test
    - BeaverTails:330k_test
    - Aegis/Nemotron-V2:validation
  polyguard_quarantine_only: true
  project_silver_train_only: true
  project_silver_train_ratio_max: 0.05
  p1_fraud_primary_required: 1.0
  train_fraud_primary_min: 0.8
  p2_collision:
    groups: 300
    rows: 600
    y_similarity_mean_min: 0.70
    y_similarity_median_min: 0.72
    y_similarity_p10_min: 0.60
    y_similarity_min_min: 0.50
    q_similarity_mean_max: 0.45
    q_similarity_p90_max: 0.60
    mutual_nearest_rate_min: 0.80
    length_ratio_min: 0.67
    length_ratio_max: 1.50
threshold_policy:
  unsafe_recall_min: 0.72
  fpr_max: 0.25
resource_gates:
