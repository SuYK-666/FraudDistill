# LightEval supplementary experiment 1: model scale vs quality/cost.
# This file is deliberately declarative: preparation and dry-run commands never
# instantiate or download a model. Model weights are downloaded only on the GPU
# host when an explicit training/evaluation command is run there.
protocol: lighteval-scale-v1
seed: 11

paths:
  train_manifest: data/prepared/exp3_neural_student/final_train_manifest.jsonl
  core_dataset: data/prepared/exp3_agent_distillation/exp3_dataset.jsonl
  relation_calibration: experiments/exp6_balanced_multi_api/balanced/calibration_manifest.jsonl
  relation_test: experiments/exp6_balanced_multi_api/balanced/frozen_test_manifest.jsonl
  hard_safe: experiments/exp6_balanced_multi_api/balanced/hard_safe_manifest.jsonl
  deepseek_checkpoint: experiments/exp3_agent_distillation_ablation/outputs/neural_student/final_distilled_student/best_step120

expected_counts:
  train: 4747
  core_dev: 1047
  core_test: 1262
  relation_calibration: 96
  relation_holdout_calibration: 60
  relation_test: 384
  hard_safe_calibration: 60
  hard_safe_test: 180

training:
  epochs: 2
  effective_batch: 32
  micro_batch_default: 2
  max_length: 512
  head_tail: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lr_lora: 0.0001
  lr_head: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.05
  eval_steps: 20
  save_steps: 40
  patience: 4
  gradient_checkpointing: true
  loss: final_distill
  selection:
    fpr_max: 0.055
    recall_min: 0.82
    primary: macro_f1
    tie_break: [real_macro_f1, auprc, mcc, earlier_step]

calibration:
  # Calibration uses 96 relation rows + 60 hard-safe rows.
  recall_min: 0.65
  hard_safe_fpr_max: 0.15
  frozen_source_threshold: 0.5622
  selection: max_relation_macro_f1_then_mcc_then_higher_threshold

cost:
  dtype_primary: bf16
  score_batch: 4
  latency_batch: 1
  latency_samples: 64
  throughput_batch: 4
  throughput_samples: 128
  gpu_hour_cny: null  # Fill with the actual rented-GPU price before reporting.

models:
  - id: qwen25_0_5b
    label: Qwen2.5-0.5B-Instruct student
    family: qwen2.5
    params_b: 0.5
    hf_id: Qwen/Qwen2.5-0.5B-Instruct
    micro_batch: 4
    eval_batch: 16
