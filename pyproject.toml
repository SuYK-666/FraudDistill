[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frauddistill"
version = "0.1.0"
description = "LLM answer risk detection with multi-agent teacher distillation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
llm = ["openai>=1.0"]
student = ["torch>=2.1", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
